# TurboWarp Plus - package catalog
#
# This file is the only hand-maintained input to the dashboard. Everything else
# (issue counts, versions, Pages status, dependency freshness) is collected from
# the GitHub and npm APIs by scripts/collect.ts.
#
# Adding a package: put its repository name in the right category (see the
# criteria just above `categories:`). The npm package name defaults to
# "@<scope>/<repo>"; override it with `npm:` when they differ, or set
# `npm: false` for repositories that are not published to npm.

owner: kubohiroya
scope: "@kubohiroya"

site:
  title: TurboWarp Plus
  tagline: >-
    An independent family of extensions, toolchains and applications that
    complement the TurboWarp project.
  taglineJa: TurboWarp を補完する、独立した拡張・ツールチェーン・アプリケーション群。
  disclaimer: >-
    Unofficial. Not affiliated with or endorsed by the TurboWarp project.
    These packages add capabilities on top of TurboWarp rather than replacing it.
  disclaimerJa: >-
    非公式。TurboWarp プロジェクトとは提携しておらず、承認も受けていません。
    本家を置き換えるのではなく、その上に機能を足すものです。
  repoUrl: https://github.com/kubohiroya/turbowarp-plus-packages
  demoEditorUrl: https://kubohiroya.github.io/turbowarp-plus-editor/editor.html

# Dependency ranges using any of these protocols are reported as local (skull).
localProtocols: [file:, link:, workspace:, portal:, patch:]

# Choosing a category. Every package belongs to exactly one. Ask these in order
# and stop at the first "yes":
#   1. Is it a non-editor application deployed and used as-is?     -> apps
#   2. Is it a guide, sample collection or documentation site?      -> docs
#   3. Is it for building, packaging or previewing extensions?     -> toolchain
#   4. Is it an editor distribution, the forked scratch-gui, or a
#      library that only the editor uses?                           -> foundation
#   5. Does a packaged app use it to host the TurboWarp runtime in
#      its own page, or is it the template such an app starts from? -> shell
#   6. Is it a contract, API or adapter that extensions from several
#      other categories build on, with no domain of its own?        -> contracts
#   7. Is it a camera source or an optical code format that packages
#      in other categories read through?                            -> camera
#   8. Does it mostly expose one JavaScript library or one browser
#      API as blocks, adding little model of its own?               -> wraps
#   9. Otherwise, pick by what the package is for, not by the medium
#      it happens to use: a QR code that carries a WebRTC offer is
#      networking, a QR code that is read from the camera is sensing.
# Each category below lists what it includes and what it sends elsewhere.
#
# Categories must not depend on each other in a cycle, counting every
# dependency kind including development dependencies: if category A uses B,
# no package in B may use A, directly or through other categories. When a
# dependency would close a cycle, move the lower-level package into a category
# of its own (as camera was split from sensing) rather than draw an arrow back.
# The dashboard warns about any cycle it finds in the collected data.

categories:
  # Includes: build tools, bundler plugins, the extension template, manifest
  #   contracts consumed by that template, and local preview.
  # Excludes: anything else a running project loads at runtime (-> shell,
  #   contracts or a domain category), and the packaged-app template, which
  #   depends on the app shell (-> shell).
  - id: toolchain
    title: Toolchain & Templates
    titleJa: ツールチェーン・テンプレート
    description: Build, package and preview TurboWarp extensions and projects.
    descriptionJa: TurboWarp 拡張とプロジェクトのビルド・パッケージ化・プレビュー。
    packages:
      - sb3-toolchain
      - vite-plugin-turbowarp-extension
      - turbowarp-extension-template
      - turbowarp-extension-manifest
      - turbowarp-sb3-source-builder
      - turbowarp-local-preview

  # Includes: the TurboWarp-Plus-Editor distribution, its scratch-gui fork,
  #   and the security dialog library that only the editor uses.
  # Excludes: extensions that only run inside the editor (-> their domain),
  #   anything a packaged app uses outside the editor (-> shell), and the data
  #   editor contract that extensions build on, even though the editor bundles
  #   it (-> contracts): the editor distribution uses extensions, so a library
  #   that extensions use cannot share its category.
  # Keep the foundation ID stable for existing JSON consumers.
  - id: foundation
    title: Editor
    titleJa: エディター
    description: TurboWarp-Plus-Editor, its forked editor and editor-only libraries.
    descriptionJa: TurboWarp-Plus-Editor、フォークしたエディター、エディター専用のライブラリ。
    packages:
      - turbowarp-plus-editor
      - scratch-gui
      - turbowarp-extension-security-dialog

  # Includes: DOM shell primitives, runtime adapters, and the title and
  #   application menu chrome and live reload control used to host the TurboWarp
  #   runtime in a packaged application page, and the template a packaged app
  #   starts from. Every app depends on turbowarp-app-shell.
  # Excludes: the editor (-> foundation), build-time preview (-> toolchain),
  #   and the apps themselves (-> apps).
  - id: shell
    title: App Shell
    titleJa: アプリシェル
    description: Host the TurboWarp runtime inside a packaged application page.
    descriptionJa: パッケージ化したアプリのページに TurboWarp の実行環境を載せる。
    packages:
      - turbowarp-app-shell
      - turbowarp-runtime-adapter
      - turbowarp-title-menu
      - turbowarp-live-reload-controller
      - turbowarp-app-template

  # Includes: contracts that packages in several categories implement or
  #   consume (named data, named functions, runtime expressions, structured
  #   diagnostics that any DSL host or app reports and the stage displays,
  #   the data editing contract and API that extensions and the editor share),
  #   and adapters to external UI and state frameworks (React, Jotai).
  # Excludes: a contract used only within one family, or a package that mainly
  #   provides blocks for one kind of data, device or service (-> that domain's
  #   category); anything only the editor uses (-> foundation).
  - id: contracts
    title: Extension Contracts
    titleJa: 拡張共通の契約
    description: Contracts and adapters shared by extensions across categories.
    descriptionJa: カテゴリをまたいで拡張が共有する契約とアダプタ。
    packages:
      - turbowarp-extension-data-editor
      - turbowarp-runtime-expression
      - turbowarp-named-data
      - turbowarp-named-functions
      - turbowarp-jotai-adapter
      - turbowarp-react-islands
      - turbowarp-diagnostic-overlay

  # Includes: values held and transformed inside the project: structured and
  #   binary data, text, HTML and Markdown built as values, and key-value
  #   storage.
  # Excludes: drawing it on the stage (-> media), sending it to another machine
  #   (-> network), the shared named-data contract itself (-> contracts), the
  #   data editor kit for block editors (-> foundation), and thin
  #   wrappers of a parser or generator library (-> wraps).
  #   HTTP body integration alone does not make a data package networking.
  # Roles: structured-data walks and iterates JSON values, and document-data
  #   owns parsed HTML and Markdown trees, which structured-data copies part
  #   by part in memory. The other packages do not implement a contract of
  #   either one: they project their structure to JSON text, or, as the
  #   Markdown and HTML builders do, pass rendered text to document-data.
  #   See docs/data-projection.ja.md.
  - id: data
    title: Data & Documents
    titleJa: データ・ドキュメント
    description: Structured data, documents, text and storage.
    descriptionJa: 構造化データ、ドキュメント、テキスト、ストレージ。
    packages:
      - turbowarp-structured-data
      - turbowarp-document-data
      - turbowarp-markdown
      - turbowarp-html
      - turbowarp-text-lines
      - turbowarp-binary-data
      - turbowarp-kvs

  # Includes: what the player sees or hears in 2D: text rendering, bubbles,
  #   notifications shown by the project, and the loading, caching and
  #   playback of image and audio assets.
  # Excludes: 3D and AR scenes (-> spatial), camera images used as input
  #   (-> camera or sensing), dialogs that guard extension loading (-> foundation), the
  #   title and application menu around a packaged app (-> shell), and the
  #   shared diagnostics overlay, defined by its input format (-> contracts).
  - id: media
    title: Stage & Presentation
    titleJa: ステージ・表示
    description: Text, bubbles, notifications and asset handling on the stage.
    descriptionJa: ステージ上のテキスト・吹き出し・通知と素材管理。
    packages:
      - turbowarp-svg-text
      - turbowarp-bubble
      - turbowarp-asset-cache
      - turbowarp-extended-notification

  # Includes: scene graphs and 3D scene descriptions, A-Frame and AR rendering,
  #   reconstruction of physical space, and calibration of where cameras and
  #   displays sit in space and time relative to each other.
  # Excludes: calibrating a single camera's lens (-> sensing) and estimating
  #   poses from camera images (-> sensing), even when the result feeds a scene.
  - id: spatial
    title: 3D, AR & Space
    titleJa: 3D・AR・空間
    description: Scene graphs, 3D scene description and spatial calibration.
    descriptionJa: シーングラフ、3D シーン記述、空間校正。
    packages:
      - turbowarp-scene-graph
      - turbowarp-3d-scene-dsl
      - turbowarp-3d-scene-runtime
      - turbowarp-aframe
      - turbowarp-ar
      - turbowarp-photogrammetry
      - turbowarp-time-space-sync

  # Includes: the camera frame source and optical code formats, such as QR
  #   structured append, that packages in several categories read through.
  # Excludes: thin wrappers of one decoder library (-> wraps), and lens
  #   calibration, recognition, pose estimation and input that interpret what
  #   the camera sees (-> sensing). These sit below spatial, network, wraps and
  #   sensing, which all read the camera or codes.
  - id: camera
    title: Camera & Codes
    titleJa: カメラ・コード
    description: Camera frame sources and optical code formats that other categories read through.
    descriptionJa: 他のカテゴリが利用する、カメラ映像の入力元と光学コードの形式。
    packages:
      - turbowarp-camera-source
      - qrcode-structured-append

  # Includes: input from the physical world: lens calibration, recognition
  #   models and pose estimation, keyboard and pointer input, and waiting for
  #   input that arrives through codes or devices.
  # Excludes: the camera source and optical code formats themselves (-> camera),
  #   packages whose purpose is reaching another machine or service, even if
  #   they use a camera, QR codes or speech to do it (-> network), and thin
  #   wrappers of one decoder library or device API (-> wraps).
  - id: sensing
    title: Sensing & Input
    titleJa: センシング・入力
    description: Lens calibration, recognition, pose estimation and input.
    descriptionJa: レンズ校正、認識、姿勢推定、入力。
    packages:
      - turbowarp-camera-calibration
      - turbowarp-teachable-machine
      - turbowarp-realtime-motion-capture
      - turbowarp-visual-tracking
      - turbowarp-async-input

  # Includes: talking to other machines: peer connections and their pairing,
  #   HTTP servers and the platforms that host them, AI and other third-party
  #   APIs, and remotely controlled devices reached through a cloud service.
  # Excludes: devices attached to this machine (-> camera, sensing or wraps) and data
  #   packages that only format request or response bodies (-> data).
  - id: network
    title: Networking & Services
    titleJa: 通信・外部サービス
    description: Peer connections, HTTP bridges and third-party service adapters.
    descriptionJa: ピア接続、HTTP ブリッジ、外部サービス連携。
    packages:
      - turbowarp-webrtc
      - turbowarp-webrtc-qrcode-pairing
      - turbowarp-http-server
      - turbowarp-cloudflare-worker
      - turbowarp-openai-realtime-api
      - turbowarp-voice-chat
      - turbowarp-sesame

  # Includes: thin extensions whose blocks mostly expose one JavaScript library
  #   (a QR encoder or decoder, a YAML parser) or one browser API (Web Speech,
  #   WebUSB, Web Crypto) as it is, adding little model of their own.
  # Excludes: packages that build their own model on top of a library, such as
  #   a scene graph over A-Frame or a recognition pipeline over Teachable
  #   Machine (-> their domain), and libraries that implement a specification
  #   themselves rather than wrap one (-> their domain).
  - id: wraps
    title: Library & API Wrappers
    titleJa: ライブラリ・API ラッパー
    description: Thin blocks over one JavaScript library or browser API.
    descriptionJa: 1つの JavaScript ライブラリやブラウザ API を薄くブロック化したもの。
    packages:
      - turbowarp-qr-display
      - turbowarp-jsqr
      - turbowarp-yaml-json
      - turbowarp-web-speech
      - turbowarp-webusb-pasori
      - turbowarp-uuid

  # Includes: applications that are deployed and used as-is, including ones
  #   that exist to verify an extension against real cameras and displays.
  # Excludes: app templates (-> shell) and documentation sites (-> docs).
  #   An app goes here even when it is published to npm.
  - id: apps
    title: Applications
    titleJa: アプリケーション
    description: Deployable applications built from the packages above.
    descriptionJa: 上記パッケージを組み合わせた、配布可能なアプリケーション。
    packages:
      - turbowarp-kamishibai-app
      - turbowarp-camera-calibration-app
      - turbowarp-photogrammetry-app
      - turbowarp-time-space-sync-app
      - turbowarp-webrtc-qrcode-pairing-app
      - turbowarp-realtime-motion-capture-app

  # Includes: guides, sample projects, and the navigation and shell shared by
  #   documentation sites.
  # Excludes: a package's own README and API docs, which stay with the package.
  - id: docs
    title: Documentation & Samples
    titleJa: ドキュメント・サンプル
    description: Guides, sample projects and the shared documentation shell.
    descriptionJa: ガイド、サンプルプロジェクト、共通ドキュメント基盤。
    packages:
      - turbowarp-kamishibai-docs
      - turbowarp-kamishibai-samples
      - turbowarp-kamishibai-site-navigation

# Per-package overrides. Only the keys that differ from the defaults are needed.
#
# Summaries are collected automatically: English from the GitHub repository
# description, Japanese from the first paragraph under the opening heading of
# the repository's README.ja.md. Set `description` or `descriptionJa` here only
# when that text does not suit a table cell — a correction belongs in the
# repository itself, where it also helps everyone reading the README.
# `npm: false` marks a repository that is deliberately not an npm package
# (documentation sites, sample collections, deployed applications). Repositories
# left at the default are reported as "unpublished" until they appear on npm,
# which is intentional: that is a status worth seeing.
overrides:
  turbowarp-plus-editor:
    buildSource: fixed-editor-gui
  scratch-gui:
    npm: false
    # A fork of someone else's project: its README is not ours to add a
    # translation to, so the Japanese summary lives here instead.
    descriptionJa: TurboWarp のエディター scratch-gui のフォーク。拡張機能セキュリティダイアログと拡張データエディターを組み込んでいます。
  turbowarp-realtime-motion-capture-app:
    npm: '@kubohiroya/turbowarp-realtime-motion-capture-app'
  turbowarp-app-template:
    npm: false
  turbowarp-kamishibai-docs:
    npm: false
  turbowarp-kamishibai-samples:
    npm: false
  turbowarp-camera-calibration-app:
    npm: false
  turbowarp-photogrammetry-app:
    npm: false
  turbowarp-time-space-sync-app:
    npm: false
  turbowarp-webrtc-qrcode-pairing-app:
    npm: false
