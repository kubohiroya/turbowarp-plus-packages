# TurboWarp Plus - package catalog
#
# This file is the only hand-maintained input to the dashboard. Everything else
# (issue counts, versions, Pages status, dependency freshness) is collected from
# the GitHub and npm APIs by scripts/collect.ts.
#
# Adding a package: put its repository name in the right category (see the
# criteria just above `categories:`). The npm package name defaults to
# "@<scope>/<repo>"; override it with `npm:` when they differ, or set
# `npm: false` for repositories that are not published to npm.

owner: kubohiroya
scope: "@kubohiroya"

site:
  title: TurboWarp Plus
  tagline: >-
    An independent family of extensions, toolchains and applications that
    complement the TurboWarp project.
  taglineJa: TurboWarp を補完する、独立した拡張・ツールチェーン・アプリケーション群。
  disclaimer: >-
    Unofficial. Not affiliated with or endorsed by the TurboWarp project.
    These packages add capabilities on top of TurboWarp rather than replacing it.
  disclaimerJa: >-
    非公式。TurboWarp プロジェクトとは提携しておらず、承認も受けていません。
    本家を置き換えるのではなく、その上に機能を足すものです。
  repoUrl: https://github.com/kubohiroya/turbowarp-plus-packages
  demoEditorUrl: https://kubohiroya.github.io/turbowarp-plus-editor/editor.html

# Dependency ranges using any of these protocols are reported as local (skull).
localProtocols: [file:, link:, workspace:, portal:, patch:]

# Choosing a category. Every package belongs to exactly one. Ask these in order
# and stop at the first "yes":
#   1. Is it a GitHub fork of an upstream TurboWarp repository
#      (scratch-gui, scratch-vm and the like)?                      -> forks
#   2. Is it the Kamishibai app, its guides, samples or navigation? -> kamishibai
#   3. Is it another non-editor app, documentation site or shared
#      documentation infrastructure still under development?       -> in-development
#   4. Is it a standalone project-development command?             -> toolchain
#      Is it a build plugin or reusable tool library?               -> toolchain-components
#      Is it a shared extension template or manifest contract?      -> contracts
#   5. Does it define the editor host interface or provide the
#      minimal runtime used in package tests?                       -> editor-testing
#   6. Is it an editor distribution (web or desktop)?               -> foundation
#      Is it a library that only the editor uses?                   -> editor-extensions
#   7. Does a packaged app use it to host the TurboWarp runtime in
#      its own page, or is it the template such an app starts from? -> shell
#   8. Is it a contract, API or adapter that extensions from several
#      other categories build on, with no domain of its own?        -> contracts
#   9. Is it a camera source or an optical code format that packages
#      in other categories read through?                            -> camera
#  10. Does it mostly expose one JavaScript library or one browser
#      API as blocks, adding little model of its own?               -> wraps
#  11. Otherwise, pick by what the package is for, not by the medium
#      it happens to use: a QR code that carries a WebRTC offer is
#      networking, a QR code that is read from the camera is sensing.
# Each category below lists what it includes and what it sends elsewhere.
#
# Categories must not depend on each other in a cycle, counting every
# dependency kind including development dependencies: if category A uses B,
# no package in B may use A, directly or through other categories. When a
# dependency would close a cycle, move the lower-level package into a category
# of its own (as camera was split from sensing) rather than draw an arrow back.
# The dashboard warns about any cycle it finds in the collected data.
#
# Dependency categories and dashboard roles are separate: a package may be a
# runnable extension or a support library within the same dependency domain.
# Use overrides.dashboardGroup for exceptions to a category's display role:
# shell/contracts default to infrastructure, and domain categories to extensions.
# This is an explicit role, independent of npm publication or Editor catalog holds.

categories:
  # Includes: standalone commands for building SB3 projects and preparing
  #   a project repository for development with the editor.
  # Excludes: build plugins and tool libraries (-> toolchain-components),
  #   shared extension templates and manifest contracts (-> contracts).
  - id: toolchain
    title: Standalone Tools
    titleJa: 単独で使うツール
    description: Commands for managing SB3 projects and preparing project repositories.
    descriptionJa: コマンドから使える、SB3 の展開・検査・ビルドとプロジェクトリポジトリの準備ツール。
    packages:
      - sb3-toolchain
      - turbowarp-plus-project-folder-starter

  # Includes: plugins and libraries embedded in another project's build
  #   or preview workflow; these do not expose their own standalone command.
  # Excludes: extension templates and manifest contracts (-> contracts),
  #   runtime app infrastructure (-> shell), and standalone commands (-> toolchain).
  - id: toolchain-components
    title: Build Plugins & Tool Libraries
    titleJa: 組み込み用ツール
    description: Plugins and libraries integrated into build and preview workflows.
    descriptionJa: 他のプロジェクトのビルドやプレビュー処理へ組み込むプラグイン・ライブラリ。
    packages:
      - vite-plugin-turbowarp-extension
      - turbowarp-sb3-source-builder
      - turbowarp-local-preview

  # Includes: only the TurboWarp-Plus-Editor web and desktop distributions.
  # Excludes: editor-only libraries (-> editor-extensions), the shared host
  #   interface and test runtime (-> editor-testing), and upstream forks (-> forks).
  # Keep the foundation ID stable for existing JSON consumers.
  - id: foundation
    title: Editor
    titleJa: エディター
    description: TurboWarp-Plus-Editor for the web and the desktop.
    descriptionJa: TurboWarp-Plus-Editor 本体（Web 版・デスクトップ版）。
    packages:
      - turbowarp-plus-editor
      - turbowarp-plus-desktop

  # Includes: editor-only libraries, such as the security dialog and workspace UI.
  # Excludes: contracts shared by extensions (-> contracts), packaged-app
  #   infrastructure (-> shell), and host interfaces and test runtimes (-> editor-testing).
  - id: editor-extensions
    title: Editor Extensions
    titleJa: エディター拡張
    description: Editor-only libraries and components that extend the editor.
    descriptionJa: エディターの機能を拡張する専用ライブラリ・構成要素。
    packages:
      - turbowarp-extension-security-dialog
      - turbowarp-document-editor
      - turbowarp-sb3-save-format
      - turbowarp-script-transfer
      - turbowarp-plus-editor-workbench
      - turbowarp-plus-editor-project-model
      - turbowarp-plus-editor-windows
      - turbowarp-plus-editor-sprite-panes
      - turbowarp-plus-editor-project-folder
      - turbowarp-plus-editor-git
      - turbowarp-plus-editor-auth
      - turbowarp-plus-editor-code-views
      - turbowarp-plus-editor-fonts
      - turbowarp-plus-editor-opfs-project

  # Editor libraries and extension contracts both use the test runtime.
  # Keep its host interface and pinned blocks here with the runtime so this
  # category does not depend back on the editor distribution or its libraries.
  - id: editor-testing
    title: Editor Test Support
    titleJa: エディターのテスト基盤
    description: Editor host interface and minimal runtime for testing editor libraries and extensions.
    descriptionJa: エディター用ライブラリや拡張のテストに使うホストの共通仕様と最小ランタイム。
    packages:
      - turbowarp-plus-editor-host
      - turbowarp-plus-editor-test-runtime
      - turbowarp-plus-editor-test-runtime-blocks

  # Includes: GitHub forks of upstream TurboWarp repositories that keep the
  #   upstream's name, history and license, whether or not they carry changes
  #   of our own yet. The editor pins the scratch-gui and scratch-vm forks.
  # Excludes: products of our own that start from an upstream codebase without
  #   being a fork, such as the desktop editor (-> foundation).
  # Forks depend on no family package, so every other category may build on
  #   them. They are not published to npm, and their summaries live in the
  #   overrides below because their READMEs are not ours to translate.
  - id: forks
    title: Upstream Forks
    titleJa: 上流のフォーク
    description: Forks of the TurboWarp editor, VM, renderer, audio engine and fonts.
    descriptionJa: TurboWarp のエディター・VM・レンダラー・音声エンジン・フォントのフォーク。
    packages:
      - scratch-gui
      - scratch-vm
      - scratch-render
      - scratch-audio
      - scratch-render-fonts

  # Includes: DOM shell primitives, runtime adapters, and the title and
  #   application menu chrome and live reload control used to host the TurboWarp
  #   runtime in a packaged application page, the verified extension loading
  #   core shared by the editor and generated apps through host-owned trust and
  #   registration ports, and the template a packaged app starts from.
  #   Every app depends on turbowarp-app-shell.
  # Excludes: the editor (-> foundation), build-time preview (-> toolchain),
  #   and the apps themselves (-> apps).
  - id: shell
    title: App Shell
    titleJa: アプリシェル
    description: Host the TurboWarp runtime inside a packaged application page.
    descriptionJa: パッケージ化したアプリのページに TurboWarp の実行環境を載せる。
    packages:
      - turbowarp-app-shell
      - turbowarp-runtime-adapter
      - turbowarp-extension-loader
      - turbowarp-title-menu
      - turbowarp-live-reload-controller
      - turbowarp-app-template

  # Includes: contracts that packages in several categories implement or
  #   consume (named data, named functions, runtime expressions, structured
  #   diagnostics that any DSL host or app reports and the stage displays,
  #   the data editing contract and API that extensions and the editor share),
  #   adapters to external UI and state frameworks (React, Jotai), and the
  #   shared extension development template and its manifest contract.
  # Excludes: a contract used only within one family, or a package that mainly
  #   provides blocks for one kind of data, device or service (-> that domain's
  #   category); anything only the editor uses (-> foundation).
  - id: contracts
    title: Extension Contracts
    titleJa: 拡張共通の契約
    description: Contracts, adapters and development templates shared by extensions across categories.
    descriptionJa: カテゴリをまたいで拡張が共有する契約・アダプタ・開発テンプレート。
    packages:
      - turbowarp-extension-template
      - turbowarp-extension-manifest
      - turbowarp-extension-data-editor
      - turbowarp-document-source
      - turbowarp-runtime-expression
      - turbowarp-named-data
      - turbowarp-named-functions
      - turbowarp-jotai-adapter
      - turbowarp-react-islands
      - turbowarp-diagnostic-overlay

  # Includes: values held and transformed inside the project: structured and
  #   binary data, text, HTML and Markdown built as values, and key-value
  #   storage.
  # Excludes: drawing it on the stage (-> media), sending it to another machine
  #   (-> network), the shared named-data contract itself (-> contracts), the
  #   data editor kit for block editors (-> foundation), and thin
  #   wrappers of a parser or generator library (-> wraps).
  #   HTTP body integration alone does not make a data package networking.
  # Roles: structured-data walks and iterates JSON values, and document-data
  #   owns parsed HTML and Markdown trees, which structured-data copies part
  #   by part in memory. The other packages do not implement a contract of
  #   either one: they project their structure to JSON text, or, as the
  #   Markdown and HTML builders do, pass rendered text to document-data.
  #   document-source defines the shared source protocol (-> contracts).
  #   Registry, persistence and project patches belong to document-data;
  #   YAML block views and source conversion belong to yaml-json. Both
  #   implementations depend on the protocol, with no reverse dependency.
  #   yaml-json builds immutable structured fragments, parses text into that
  #   model, validates schemas and renders YAML/JSON for other data packages.
  #   See docs/data-projection.ja.md.
  - id: data
    title: Data & Documents
    titleJa: データ・ドキュメント
    description: Structured data, documents, text and storage.
    descriptionJa: 構造化データ、ドキュメント、テキスト、ストレージ。
    packages:
      - turbowarp-structured-data
      - turbowarp-document-data
      - turbowarp-yaml-json
      - turbowarp-markdown
      - turbowarp-html
      - turbowarp-text-lines
      - turbowarp-binary-data
      - turbowarp-kvs

  # Includes: what the player sees or hears in 2D: text rendering, bubbles,
  #   notifications shown by the project, and the loading, caching and
  #   playback of image and audio assets.
  # Excludes: 3D and AR scenes (-> spatial), camera images used as input
  #   (-> camera or sensing), dialogs that guard extension loading (-> foundation), the
  #   title and application menu around a packaged app (-> shell), and the
  #   shared diagnostics overlay, defined by its input format (-> contracts).
  - id: media
    title: Stage & Presentation
    titleJa: ステージ・表示
    description: Text, bubbles, notifications and asset handling on the stage.
    descriptionJa: ステージ上のテキスト・吹き出し・通知と素材管理。
    packages:
      - turbowarp-svg-text
      - turbowarp-bubble
      - turbowarp-asset-cache
      - turbowarp-extended-notification

  # Includes: scene graphs and 3D scene descriptions, A-Frame and AR rendering,
  #   reconstruction of physical space, and calibration of where cameras and
  #   displays sit in space and time relative to each other.
  # Excludes: calibrating a single camera's lens (-> sensing) and estimating
  #   poses from camera images (-> sensing), even when the result feeds a scene.
  - id: spatial
    title: 3D, AR & Space
    titleJa: 3D・AR・空間
    description: Scene graphs, 3D scene description and spatial calibration.
    descriptionJa: シーングラフ、3D シーン記述、空間校正。
    packages:
      - turbowarp-scene-graph
      - turbowarp-3d-scene-dsl
      - turbowarp-3d-scene-runtime
      - turbowarp-aframe
      - turbowarp-ar
      - turbowarp-photogrammetry
      - turbowarp-time-space-sync

  # Includes: the camera frame source and optical code formats, such as QR
  #   structured append, that packages in several categories read through.
  # Excludes: thin wrappers of one decoder library (-> wraps), and lens
  #   calibration, recognition, pose estimation and input that interpret what
  #   the camera sees (-> sensing). These sit below spatial, network, wraps and
  #   sensing, which all read the camera or codes.
  - id: camera
    title: Camera & Codes
    titleJa: カメラ・コード
    description: Camera frame sources and optical code formats that other categories read through.
    descriptionJa: 他のカテゴリが利用する、カメラ映像の入力元と光学コードの形式。
    packages:
      - turbowarp-camera-source
      - qrcode-structured-append

  # Includes: input from the physical world: lens calibration, recognition
  #   models and pose estimation, keyboard and pointer input, and waiting for
  #   input that arrives through codes or devices.
  # Excludes: the camera source and optical code formats themselves (-> camera),
  #   packages whose purpose is reaching another machine or service, even if
  #   they use a camera, QR codes or speech to do it (-> network), and thin
  #   wrappers of one decoder library or device API (-> wraps).
  - id: sensing
    title: Sensing & Input
    titleJa: センシング・入力
    description: Lens calibration, recognition, pose estimation and input.
    descriptionJa: レンズ校正、認識、姿勢推定、入力。
    packages:
      - turbowarp-camera-calibration
      - turbowarp-teachable-machine
      - turbowarp-realtime-motion-capture
      - turbowarp-visual-tracking
      - turbowarp-async-input

  # Includes: talking to other machines: peer connections and their pairing,
  #   HTTP servers and the platforms that host them, AI and other third-party
  #   APIs, and remotely controlled devices reached through a cloud service.
  # Excludes: devices attached to this machine (-> camera, sensing or wraps) and data
  #   packages that only format request or response bodies (-> data).
  - id: network
    title: Networking & Services
    titleJa: 通信・外部サービス
    description: Peer connections, HTTP bridges and third-party service adapters.
    descriptionJa: ピア接続、HTTP ブリッジ、外部サービス連携。
    packages:
      - turbowarp-webrtc
      - turbowarp-webrtc-qrcode-pairing
      - turbowarp-http-server
      - turbowarp-cloudflare-worker
      - turbowarp-openai-realtime-api
      - turbowarp-voice-chat
      - turbowarp-sesame

  # Includes: thin extensions whose blocks mostly expose one JavaScript library
  #   (a QR encoder or decoder) or one browser API (Web Speech,
  #   WebUSB, Web Crypto) as it is, adding little model of their own.
  # Excludes: packages that build their own model on top of a library, such as
  #   a scene graph over A-Frame or a recognition pipeline over Teachable
  #   Machine (-> their domain), and libraries that implement a specification
  #   themselves rather than wrap one (-> their domain).
  - id: wraps
    title: Library & API Wrappers
    titleJa: ライブラリ・API ラッパー
    description: Thin blocks over one JavaScript library or browser API.
    descriptionJa: 1つの JavaScript ライブラリやブラウザ API を薄くブロック化したもの。
    packages:
      - turbowarp-qr-display
      - turbowarp-zxing
      - turbowarp-web-speech
      - turbowarp-webusb-pasori
      - turbowarp-uuid

  # Includes: the Kamishibai app and its dedicated guides, samples and navigation.
  # Excludes: shared site infrastructure and other apps (-> in-development).
  - id: kamishibai
    title: Kamishibai
    titleJa: 紙芝居
    description: The Kamishibai app, guides, sample projects and dedicated site navigation.
    descriptionJa: 紙芝居アプリ本体と、使い方のガイド・サンプル・専用サイトナビゲーション。
    packages:
      - turbowarp-kamishibai-app
      - turbowarp-kamishibai-docs
      - turbowarp-kamishibai-samples
      - turbowarp-kamishibai-site-navigation

  # Includes: other apps, project hosting and shared documentation infrastructure.
  # Excludes: editor distributions (-> foundation), app templates (-> shell)
  #   and each package's own README and API docs, which stay with the package.
  - id: in-development
    title: Other (in development)
    titleJa: その他(開発中)
    description: Other apps under development, project hosting and shared site infrastructure.
    descriptionJa: 開発中のその他のアプリと、プロジェクト公開サイト・共通サイト基盤。
    packages:
      - turbowarp-camera-calibration-app
      - turbowarp-photogrammetry-app
      - turbowarp-time-space-sync-app
      - turbowarp-webrtc-qrcode-pairing-app
      - turbowarp-realtime-motion-capture-app

      - turbowarp-plus-site-header
      - turbowarp-plus-projects

# Per-package overrides. Only the keys that differ from the defaults are needed.
#
# Summaries are collected automatically: English from the GitHub repository
# description, Japanese from the first paragraph under the opening heading of
# the repository's README.ja.md. Set `description` or `descriptionJa` here only
# when that text does not suit a table cell — a correction belongs in the
# repository itself, where it also helps everyone reading the README.
# `npm: false` marks a repository that is deliberately not an npm package
# (documentation sites, sample collections, deployed applications).
# `pages: false` leaves the Pages column empty for a repository whose published
# site is not ours to show, instead of reporting it as down. Repositories
# left at the default are reported as "unpublished" until they appear on npm,
# which is intentional: that is a status worth seeing.
# `application: true` identifies deployed apps independently of their category
# for favicon collection and bundled-extension sandbox requirements.
# `dashboardGroup: extensions | infrastructure` changes only the list and TOC
# group. It does not change dependency categories or Editor catalog membership.
# `editorCatalogHold: <reason>` keeps an extension (and whatever depends on it)
# out of the Editor extension catalog even when its dependency ranges are met.
# Remove the key to let it back in.
# `releaseHold: <reason>` keeps a dependency release (bump:downstream) from
# bumping and publishing that repository: its owner decides each version and
# folds dependency updates into its own release. Its dependents are planned
# only through their other updated dependencies.
overrides:
  turbowarp-title-menu:
    dashboardGroup: extensions
  turbowarp-runtime-expression:
    dashboardGroup: extensions
  turbowarp-named-data:
    dashboardGroup: extensions
  turbowarp-named-functions:
    dashboardGroup: extensions
  turbowarp-jotai-adapter:
    dashboardGroup: extensions
  turbowarp-react-islands:
    dashboardGroup: extensions
  turbowarp-diagnostic-overlay:
    dashboardGroup: extensions
  turbowarp-scene-graph:
    dashboardGroup: infrastructure
  qrcode-structured-append:
    dashboardGroup: infrastructure
  turbowarp-plus-editor:
    buildSource: fixed-editor-gui
  scratch-gui:
    npm: false
    npmReason: {"en": "Built into TurboWarp Plus Editor from a verified Git commit; not a separate npm distribution.", "ja": "検証済みGitコミットからEditorへ組み込むソース。独立したnpm配布物ではありません。"}
    # Its GitHub Pages site is no longer public, so the dashboard has nothing
    # to link or screenshot: without this it would report the site as down and
    # keep showing the thumbnail taken while it was still up.
    pages: false
    # A fork of someone else's project: its README is not ours to add a
    # translation to, so the Japanese summary lives here instead.
    descriptionJa: TurboWarp のエディター scratch-gui のフォーク。拡張機能セキュリティダイアログと拡張データエディターを組み込んでいます。
  scratch-vm:
    npm: false
    npmReason: {"en": "The Editor pins this VM fork by Git commit and builds it with the GUI.", "ja": "EditorがGitコミットを固定し、GUIと一緒にビルドするVMフォークです。"}
    descriptionJa: TurboWarp の実行エンジン scratch-vm のフォーク。拡張の登録口、スクリプト取り込みの結果、ブロックからの同期実行などを足しています。
  scratch-render:
    npm: false
    npmReason: {"en": "An upstream source mirror; the GUI uses TurboWarp Git dependencies, not a separately maintained npm fork.", "ja": "上流ソースのミラーです。GUIはTurboWarpのGit配布を使い、独自npm版は保守していません。"}
    descriptionJa: TurboWarp のレンダラー scratch-render のフォーク。
  scratch-audio:
    npm: false
    npmReason: {"en": "An upstream source mirror; the GUI uses TurboWarp Git dependencies, not a separately maintained npm fork.", "ja": "上流ソースのミラーです。GUIはTurboWarpのGit配布を使い、独自npm版は保守していません。"}
    descriptionJa: TurboWarp の音声エンジン scratch-audio のフォーク。
  scratch-render-fonts:
    npm: false
    npmReason: {"en": "An upstream source mirror; font sources are consumed by the GUI build.", "ja": "上流ソースのミラーです。フォントはGUIのビルドで取り込みます。"}
    descriptionJa: TurboWarp の描画用フォント scratch-render-fonts のフォーク。
  turbowarp-plus-desktop:
    npm: false
    npmReason: {"en": "A desktop application built as macOS, Windows and Linux installers, not an npm library.", "ja": "macOS・Windows・Linuxのインストーラーを作るアプリで、npmライブラリではありません。"}
    # The repository has no description yet and its README is Japanese only.
    description: TurboWarp Plus Editor for the desktop, built on TurboWarp Desktop.
    descriptionJa: TurboWarp Plus Editor のデスクトップ版。TurboWarp Desktop を基点にしています。
  turbowarp-realtime-motion-capture-app:
    application: true
    npm: '@kubohiroya/turbowarp-realtime-motion-capture-app'
  turbowarp-kamishibai-app:
    application: true
    releaseHold: >-
      紙芝居は当面4.0.xで進める。4.1のリリースには別途の組織上の意味があるため、持ち主の指示なしに上げない。
      DSLにも版番号が書き込まれるので、重大な非互換がない更新で4.1に上げるのはむしろ有害。
      版はリリースごとに持ち主が決め、SB3の版の切り出し・リリースノートと一緒に出す。依存の更新は次の4.0.xのリリースに含める。
  turbowarp-kamishibai-docs:
    npm: false
    npmReason: {"en": "Documentation is distributed as a Pages site, not as a runtime npm library.", "ja": "文書はPagesサイトで配布します。実行時にimportするnpmライブラリではありません。"}
  turbowarp-kamishibai-samples:
    npm: false
    npmReason: {"en": "The work library distributes SB3, Web applications and authored sources on Pages.", "ja": "作品集はPagesからSB3・Webアプリ・台本ソースを配布します。"}
  turbowarp-plus-projects:
    npm: false
    npmReason: {"en": "A collection of project sources; it has no package.json or npm runtime API.", "ja": "プロジェクトのソース集で、package.jsonやnpm用の実行APIはありません。"}
  turbowarp-camera-calibration-app:
    application: true
    npm: false
    npmReason: {"en": "An end-user app scaffold with UI and SB3 build output, not an importable library.", "ja": "UIとSB3をビルドする利用者向けアプリの雛形です。importして使うライブラリではありません。"}
  turbowarp-photogrammetry-app:
    application: true
    npm: false
    npmReason: {"en": "An end-user app scaffold with UI and SB3 build output, not an importable library.", "ja": "UIとSB3をビルドする利用者向けアプリの雛形です。importして使うライブラリではありません。"}
  turbowarp-time-space-sync-app:
    application: true
