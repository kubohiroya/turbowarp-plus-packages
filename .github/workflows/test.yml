name: Test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the catalog parses and every entry is unique
        run: node -e "import('./scripts/lib/catalog.mjs').then(m => m.loadCatalog('catalog.yaml')).then(c => console.log(c.entries.length + ' entries'))"
