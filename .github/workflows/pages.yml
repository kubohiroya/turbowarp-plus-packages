name: Collect and publish the dashboard

on:
  push:
    branches: [main]
  schedule:
    # Every day at 21:00 UTC (06:00 JST), after a typical day of releases.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than ubuntu-latest: `playwright install --with-deps` only
    # knows the system packages for Ubuntu 20.04, 22.04 and 24.04, so the
    # migration of ubuntu-latest to Ubuntu 26 would break the icon and
    # thumbnail steps. Move this on once Playwright lists the newer release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Install the browser used for icons and thumbnails
        run: npx playwright install --with-deps chromium

      - name: Generate brand assets
        run: npm run icons

      - name: Collect package data
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What the last run published, so a package the CDN refuses to serve today
      # keeps its last known-good entry instead of costing us the publication.
      # A miss simply leaves no fallback, and an unreadable package fails.
      - name: Restore the extension catalog fallback
        uses: actions/cache@v6
        with:
          path: data/extension-catalog-state.json
          key: extension-catalog-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            extension-catalog-v1-${{ github.ref_name }}-

      - name: Generate the Editor extension catalog
        run: npm run editor:catalog

      - name: Restore thumbnail snapshots
        uses: actions/cache@v6
        with:
          path: site/thumbs
          key: thumbnails-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            thumbnails-v1-${{ github.ref_name }}-

      - name: Screenshot the published sites
        run: npm run thumbnails

      - name: Render the dashboard
        run: npm run render

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-data
          path: data/dashboard.json
          retention-days: 30

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
